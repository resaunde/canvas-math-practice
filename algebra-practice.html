
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>College Algebra Practice</title>

  <script
    type="module"
    src="https://esm.run/mathlive">
  </script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 650px;
      margin: 30px auto;
      padding: 20px;
      color: #222;
    }

    math-field {
      display: block;
      flex: 1;
      min-width: 0;
      min-height: 58px;
      box-sizing: border-box;
      padding: 14px;
      font-size: 24px;
      border: 2px solid #555;
      border-radius: 8px;
      background: white;
    }

    math-field:focus-within {
      outline: 3px solid #013c65;
      outline-offset: 2px;
    }

    .answer-row {
      display: flex;
      align-items: stretch;
      gap: 10px;
      margin-top: 8px;
    }

    button {
      cursor: pointer;
      font-size: 16px;
      padding: 12px 18px;
      border-radius: 8px;
    }

    #keyboard-button {
      background: #eee;
      border: 2px solid #555;
      font-size: 24px;
      min-width: 60px;
    }

    #check-button {
      background: #013c65;
      color: white;
      border: 2px solid #013c65;
      margin-top: 20px;
    }

    #feedback {
      font-size: 18px;
      margin-top: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 24px;
    }
  </style>
</head>

<body>
  <h1>College Algebra Practice</h1>

  <p>Solve the equation:</p>
  <p style="font-size: 26px;">x² - 5x + 6 = 0</p>

  <label for="student-answer">Your Answer</label>

  <div class="answer-row">
    <math-field
      id="student-answer"
      math-virtual-keyboard-policy="manual"
      aria-label="Your answer">
    </math-field>

    <button
      id="keyboard-button"
      type="button"
      aria-label="Open mathematical keyboard"
      title="Open mathematical keyboard">
      &#x2328;
    </button>
  </div>

  <button id="check-button" type="button">
    Check Answer
  </button>

  <p id="feedback" role="status" aria-live="polite">
  </p>

  <script>
    const answerField =
      document.getElementById("student-answer");

    const checkButton =
      document.getElementById("check-button");

    const keyboardButton =
      document.getElementById("keyboard-button");

    const feedback =
      document.getElementById("feedback");

    // Hide MathLive's built-in keyboard toggle.
    answerField.addEventListener("focus", () => {
      answerField.mathVirtualKeyboardPolicy = "manual";
    });

    // Show the mathematical keyboard.
    keyboardButton.addEventListener("click", () => {
      answerField.focus();
      window.mathVirtualKeyboard.show();
    });

    // Check the answer.
    checkButton.addEventListener("click", () => {
      let answer = answerField.value;

      answer = answer.replace(/\s/g, "");
      answer = answer.replace(/^x=/i, "");

     
const solutions = answer
  .replace(/^x=/i, "")
  .split(",")
  .filter(value => value !== "");

const correctSolutions = ["2", "3"];

const matches = solutions.filter(
  value => correctSolutions.includes(value)
);

const uniqueMatches = [...new Set(matches)];

if (
  solutions.length === 2 &&
  uniqueMatches.length === 2
) {
  feedback.textContent =
    "Correct! Both solutions are 2 and 3.";
} else if (uniqueMatches.length === 1) {
  feedback.textContent =
    "Partially correct. You found one solution. " +
    "Can you find the other?";
} else {
  feedback.textContent =
    "Not quite. Try factoring the equation " +
    "and using the zero product property.";
}

    });

    // Clear old feedback when the answer changes.
    answerField.addEventListener("input", () => {
      feedback.textContent = "";
    });
  </script>
</body>
</html>
